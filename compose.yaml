# Konkan Discovery Platform: base Compose stack (production-like).
#
#   docker compose up -d                      # base + compose.override.yaml (local dev)
#   docker compose -f compose.yaml up -d      # base only: NO ports published to the host
#   docker compose --profile redis up -d      # also start Redis
#
# Variables are read from the repository-root `.env` (see `.env.example`). `:?` makes Compose
# fail fast when a required secret is missing instead of starting with an empty password.

name: konkan

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-backend-db-env: &backend-db-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

services:
  db:
    <<: *hardening
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER is required}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/initdb/20-roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    healthcheck:
      # TCP check (-h 127.0.0.1): the image's temporary init server listens on the Unix socket
      # only, so this stays unhealthy until init scripts (roles, PostGIS) have finished.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    shm_size: 256mb

  migrate:
    build:
      context: apps/backend
      target: runtime
    image: konkan-backend:local
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *backend-db-env
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER is required}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: apps/backend
      target: runtime
    image: konkan-backend:local
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *backend-db-env
      # Runtime role only: the API never receives migrator or superuser credentials.
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  redis:
    <<: *hardening
    image: redis:8-alpine
    profiles: ['redis']
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
