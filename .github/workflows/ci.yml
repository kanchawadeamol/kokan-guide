# Continuous integration for the whole monorepo.
#
# Third-party actions are pinned to full commit SHAs (version in the trailing comment) so a
# moved or compromised tag cannot change what runs. Dependabot keeps them updated.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  # ------------------------------------------------------------------ JS / TS workspaces
  js:
    name: JS · audit, format, lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (all workspaces)
        run: npm audit --audit-level=moderate
      - name: Single React copy (Expo/React Native requirement)
        run: |
          count=$(find . -path ./apps/backend -prune -o -type d -path '*node_modules/react' -print | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one React copy, found $count"
            find . -path ./apps/backend -prune -o -type d -path '*node_modules/react' -print
            exit 1
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # ------------------------------------------------------------------ Python backend
  backend:
    name: Backend · lint, types, unit + integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - name: Ruff on repository scripts
        working-directory: .
        run: ruff check scripts && ruff format --check scripts
      - run: mypy
      - name: Unit tests (no database)
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=90
      - name: Dependency audit (hash-locked set, no install needed)
        run: pip-audit --strict --disable-pip --require-hashes -r requirements-dev.lock

      - name: Create CI .env with generated secrets
        working-directory: .
        run: python scripts/create-dev-env.py
      - name: Start PostGIS, migrations and API (Docker Compose)
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Integration tests (live database, role privileges)
        run: python -m pytest -m integration
      - name: Migrations match models
        run: alembic check
      - name: API readiness through the container
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/ready
      - name: Compose logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        working-directory: .
        run: docker compose down -v

  # ------------------------------------------------------------------ API contract
  api-contract:
    name: API client matches backend OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements.lock
      - run: npm ci
      - name: Install backend (runtime dependencies only)
        working-directory: apps/backend
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Generated client is up to date
        run: npm run api:check
        env:
          PYTHON: python

  # ------------------------------------------------------------------ Browser end-to-end
  e2e:
    name: E2E · ${{ matrix.app }} (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [admin, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright tests (production build)
        run: npm run test:e2e -w apps/${{ matrix.app }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report
          retention-days: 14

  # ------------------------------------------------------------------ Mobile
  mobile:
    name: Mobile · expo-doctor + Metro bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: expo-doctor
        run: npm run doctor -w apps/mobile
      - name: Bundle JavaScript for Android and iOS
        working-directory: apps/mobile
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          CI: '1'

  # ------------------------------------------------------------------ Repository hygiene
  hygiene:
    name: Secrets scan + workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
