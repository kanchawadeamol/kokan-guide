# Local development overrides (loaded automatically by `docker compose up`).
# Ports are bound to 127.0.0.1 by default: not reachable from other machines on the network.

services:
  db:
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'

  api:
    build:
      target: dev
    image: konkan-backend:dev
    read_only: false
    environment:
      # Docker Desktop on Windows does not forward file events from bind mounts.
      WATCHFILES_FORCE_POLLING: 'true'
    volumes:
      - ./apps/backend/app:/srv/app:ro
    ports:
      # API_BIND_ADDRESS defaults to 127.0.0.1 (this PC only). For phone testing over Wi-Fi,
      # `npm run mobile:lan` sets it to this PC's LAN IP. The database is never exposed.
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000'
